<svg viewBox="0 0 316 112" role="img" aria-label="Circuit diagram of the unitary half of teleportation" class="circ" xmlns="http://www.w3.org/2000/svg"><style>svg{--bg:#fbfbfd;--fg:#15151c;--muted:#585a68;--line:#e1e2ea;--surface:#fff;--soft:#f1f1f7;--accent:#5b3fb0;--accent-fg:#fff;--good:#0f7b5f;--bad:#b42d27;--mono:ui-monospace,Menlo,Consolas,monospace;}@media (prefers-color-scheme: dark){svg{--bg:#0d0c14;--fg:#e9e8f0;--muted:#a09eb4;--line:#25243a;--surface:#14131f;--soft:#1a1927;--accent:#b9a4ff;--accent-fg:#170f33;--good:#4fd1a5;--bad:#ff7b73;}}
.circ .wire { stroke: var(--muted); stroke-width: 1; }
.circ .qlab, .circ .sub, .chart .tick { fill: var(--muted); font: 10px var(--mono); }
.circ .box { fill: var(--surface); stroke: var(--accent); stroke-width: 1.5; }
.circ .meas { stroke: var(--muted); }
.circ .glab { fill: var(--fg); font: 600 11px var(--mono); }
.circ .dot { fill: var(--accent); }
.circ .tgt { fill: var(--surface); stroke: var(--accent); stroke-width: 1.5; }
.circ .link, .circ .arc { stroke: var(--accent); stroke-width: 1.5; fill: none; }
.circ .op.active .box { fill: var(--accent); }
.circ .op.active .glab { fill: var(--accent-fg); }
.circ .op.active .link, .circ .op.active .arc { stroke-width: 2.5; }
.circ .op.active .dot { r: 5.5px; }
.circ .op { transition: opacity .3s; }
.circ .op.later { opacity: .35; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { stroke: var(--muted); stroke-width: 1; }
.chart .bar { fill: var(--accent); }
.chart .band { fill: var(--accent); opacity: .14; }
.chart .gateline { stroke: var(--bad); stroke-width: 1.2; stroke-dasharray: 4 3; }
.chart .gtext { fill: var(--bad); font: 10px var(--mono); }
.chart .line { fill: none; stroke-width: 2; }
.chart .line.s0, .chart .pt.s0 { stroke: var(--accent); }
.chart .line.s1, .chart .pt.s1 { stroke: var(--good); }
.chart .pt { fill: var(--surface); stroke-width: 1.5; }
.chart .ltext.s0 { fill: var(--accent); font: 600 10px var(--mono); }
.chart .ltext.s1 { fill: var(--good); font: 600 10px var(--mono); }
</style><rect width="100%" height="100%" fill="var(--bg)"/><text x="6" y="22" class="qlab">q0</text><line x1="30" y1="18" x2="308" y2="18" class="wire"/><text x="6" y="56" class="qlab">q1</text><line x1="30" y1="52" x2="308" y2="52" class="wire"/><text x="6" y="90" class="qlab">q2</text><line x1="30" y1="86" x2="308" y2="86" class="wire"/><g class="op"><rect x="46.0" y="7" width="24" height="22" rx="3" class="box"/><text x="58.0" y="22" text-anchor="middle" class="glab">H</text></g><g class="op"><rect x="90.0" y="7" width="24" height="22" rx="3" class="box"/><text x="102.0" y="22" text-anchor="middle" class="glab">Rz</text><text x="102.0" y="40" text-anchor="middle" class="sub">1&#960;/3</text></g><g class="op"><rect x="134.0" y="41" width="24" height="22" rx="3" class="box"/><text x="146.0" y="56" text-anchor="middle" class="glab">H</text></g><g class="op"><line x1="190.0" y1="52" x2="190.0" y2="86" class="link"/><circle cx="190.0" cy="52" r="4" class="dot"/><circle cx="190.0" cy="86" r="9" class="tgt"/><line x1="181.0" y1="86" x2="199.0" y2="86" class="link"/><line x1="190.0" y1="77" x2="190.0" y2="95" class="link"/></g><g class="op"><line x1="234.0" y1="18" x2="234.0" y2="52" class="link"/><circle cx="234.0" cy="18" r="4" class="dot"/><circle cx="234.0" cy="52" r="9" class="tgt"/><line x1="225.0" y1="52" x2="243.0" y2="52" class="link"/><line x1="234.0" y1="43" x2="234.0" y2="61" class="link"/></g><g class="op"><rect x="266.0" y="7" width="24" height="22" rx="3" class="box"/><text x="278.0" y="22" text-anchor="middle" class="glab">H</text></g></svg>